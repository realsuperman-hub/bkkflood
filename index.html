<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BKKFLOOD — น้ำท่วม กทม. ปริมณฑล และภาคตะวันออก</title>
  <meta name="description" content="แผนที่ระดับน้ำ พยากรณ์ฝนและน้ำทะเลหนุน 48 ชม. และรายงานจุดน้ำท่วมจากประชาชน สำหรับกรุงเทพฯ ปริมณฑล และภาคตะวันออก (ฉะเชิงเทรา ชลบุรี ระยอง)" />
  <meta name="theme-color" content="#0b3d5c" />
  <link rel="canonical" href="https://bkkflood.web.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BKKFLOOD" />
  <meta property="og:locale" content="th_TH" />
  <meta property="og:url" content="https://bkkflood.web.app/" />
  <meta property="og:title" content="BKKFLOOD — จุดน้ำท่วม กทม. ปริมณฑล และภาคตะวันออก ตอนนี้" />
  <meta property="og:description" content="เช็กก่อนเดินทาง: แผนที่จุดน้ำท่วมจริง ระดับน้ำ ฝนตรวจวัดจริง พยากรณ์ 48 ชม. และแจ้งเตือนอัตโนมัติ" />
  <meta property="og:image" content="https://bkkflood.web.app/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://bkkflood.web.app/og.png" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BKKFLOOD" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <div id="map" aria-label="แผนที่น้ำท่วม"></div>

    <header class="topbar">
      <div class="brand" role="img" aria-label="BKKFLOOD"><img class="brand-logo" src="/logo.svg" alt="" width="28" height="28" /><span class="brand-text">BKKFLOOD</span></div>
      <div class="topbar-actions">
        <button id="btn-layers" class="chip-btn" aria-haspopup="true" aria-expanded="false" aria-label="เลเยอร์แผนที่">
          <svg class="ly-ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3 2.5 8.5 12 14l9.5-5.5L12 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m2.5 13 9.5 5.5 9.5-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span class="ly-txt">เลเยอร์</span>
        </button>
      </div>
    </header>

    <form id="search" class="searchbar" role="search">
      <input id="search-q" type="search" placeholder="ค้นหาถนน / ซอย / เขต" enterkeyhint="search" autocomplete="off" aria-label="ค้นหาถนน ซอย เขต หรือสถานที่" maxlength="80" />
      <button type="submit" aria-label="ค้นหา"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </form>

    <div id="layers-pop" class="layers-pop" hidden>
      <label><input type="checkbox" id="ly-floods" checked /> จุดน้ำท่วม (แจ้ง กทม.)</label>
      <label hidden><input type="checkbox" id="ly-repeat" /> จุดท่วมซ้ำ (ประวัติแจ้งย้อนหลัง)</label>
      <label hidden><input type="checkbox" id="ly-windy" /> กล้อง Windy (ภาพย้อนหลัง 24 ชม.)</label>
      <label hidden><input type="checkbox" id="ly-mcams" /> ภาพกล้อง CCTV ล่าสุด (ซูมเข้า)</label>
      <label hidden><input type="checkbox" id="ly-sat" /> น้ำท่วมจากดาวเทียม (GISTDA)</label>
      <label><input type="checkbox" id="ly-traffic" checked /> จราจรติดขัด + เหตุการณ์ (กทม.)</label>
      <label><input type="checkbox" id="ly-cams" /> กล้องจราจร กทม. (ซูมเข้า)</label>
      <label><input type="checkbox" id="ly-gauges" checked /> สถานีวัดระดับน้ำ</label>
      <label><input type="checkbox" id="ly-reports" checked /> รายงานจากประชาชน</label>
      <label><input type="checkbox" id="ly-rain" /> สถานีวัดฝน (ฝนตกจริง)</label>
      <label><input type="checkbox" id="ly-radar" /> เรดาร์ฝน (ย้อนหลัง ~2 ชม.)</label>
      <div id="radar-time" class="muted small" hidden></div>
      <hr />
      <div class="legend">
        <button type="button" class="btn btn-sm lg-all lg-top" data-act="legend-open">ดูสัญลักษณ์ทั้งหมด</button>
        <div class="legend-title legend-head">สัญลักษณ์ของเลเยอร์ที่เปิด</div>
        <div id="legend-items"></div>
      </div>
    </div>

    <div id="banner" class="banner" hidden></div>

    <aside id="panel" class="panel" data-open="false" aria-label="ข้อมูลและพยากรณ์">
      <button id="grabber" class="grabber" aria-label="ขยายหรือย่อแผงข้อมูล"><span></span></button>
      <div id="peek" class="peek" hidden></div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="overview" aria-selected="true">สถานการณ์</button>
        <button role="tab" data-tab="forecast" aria-selected="false">พยากรณ์จุด</button>
        <button role="tab" data-tab="reports" aria-selected="false">จุดท่วม <span id="reports-count" class="count"></span></button>
        <button role="tab" data-tab="help" aria-selected="false">ช่วยเหลือ</button>
      </nav>
      <div id="tab-body" class="tab-body" role="tabpanel"></div>
    </aside>

    <nav id="bottom-nav" class="bottom-nav" aria-label="เมนูหลัก">
      <button class="nav-item" type="button" data-nav="overview" aria-label="สถานการณ์"><span class="nav-ic"><svg class="ni " viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg></span><span class="nav-lb">สถานการณ์</span></button>
      <button class="nav-item" type="button" data-nav="forecast" aria-label="พยากรณ์จุด"><span class="nav-ic"><svg class="ni " viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 1 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.4"/></svg></span><span class="nav-lb">พยากรณ์จุด</span></button>
      <button class="nav-report" id="nav-report" type="button" aria-label="แจ้งจุดน้ำท่วม"><span class="nav-fab"><svg class="ni " viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="nav-lb">แจ้งท่วม</span></button>
      <button class="nav-item" type="button" data-nav="reports" aria-label="จุดท่วม"><span class="nav-ic"><svg class="ni " viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.2 2.9 19.5a1 1 0 0 0 .86 1.5h16.48a1 1 0 0 0 .86-1.5L12 4.2Z"/><path d="M12 10v4.2M12 17.4v.01"/></svg><span class="nav-badge" id="nav-badge" hidden></span></span><span class="nav-lb">จุดท่วม</span></button>
      <button class="nav-item" type="button" data-nav="help" aria-label="ช่วยเหลือ"><span class="nav-ic"><svg class="ni " viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.6"/><path d="m14.6 14.6 3.4 3.4M9.4 14.6 6 18M6 6l3.4 3.4M18 6l-3.4 3.4"/></svg></span><span class="nav-lb">ช่วยเหลือ</span></button>
    </nav>


    <div class="fab-col">
      <button id="btn-room" class="fab fab-cam" aria-label="กล้อง: ห้องมอนิเตอร์และกล้องสด" title="กล้อง" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 4h8v7H3zM13 4h8v7h-8zM3 13h8v7H3zM13 13h8v7h-8z"/></svg>
        <span class="fab-txt">กล้อง</span>
      </button>
      <button id="btn-locate" class="fab fab-small" aria-label="ไปยังตำแหน่งของฉัน">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      </button>
      <button id="btn-report" class="fab fab-report">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        แจ้งท่วม
      </button>
    </div>

    <div id="pickbar" class="pickbar" hidden>
      <div class="pick-pin" aria-hidden="true"></div>
      <div class="pickbar-card">
        <div class="seg" role="group" aria-label="รูปแบบการแจ้ง">
          <button type="button" data-pmode="point" aria-pressed="true">📍 ปักหมุดจุด</button>
          <button type="button" data-pmode="line" aria-pressed="false">〰 วาดถนนช่วงที่ท่วม</button>
          <button type="button" data-pmode="area" aria-pressed="false">⬠ วาดพื้นที่</button>
        </div>
        <p id="pick-hint" class="small muted"></p>
        <div id="draw-stats" class="small draw-stats" hidden></div>
        <div class="pickbar-actions">
          <button id="pick-gps" class="btn">ใช้ตำแหน่งฉัน</button>
          <button id="draw-add" class="btn" hidden>+ จุดกลางจอ</button>
          <button id="draw-undo" class="btn" hidden>↶ ย้อนกลับ</button>
          <button id="draw-clear" class="btn btn-ghost" hidden>ล้าง</button>
          <button id="pick-ok" class="btn btn-primary">ยืนยัน</button>
          <button id="pick-cancel" class="btn btn-ghost">ยกเลิก</button>
        </div>
      </div>
    </div>

    <section id="room" class="room" hidden aria-label="ห้องมอนิเตอร์กล้อง">
      <header class="room-bar">
        <div class="rm-seg" role="group" aria-label="โหมดแสดงผล"><button type="button" data-room-mode="map">🗺 แผนที่</button><button type="button" data-room-mode="room" aria-pressed="true">▦ ห้องมอนิเตอร์</button><button type="button" data-room-mode="longdo" hidden>📷 กล้องสด Longdo</button></div>
        <select id="room-district" class="rm-select" aria-label="เลือกเขต"></select>
        <button id="room-near" class="rm-chip" type="button" aria-pressed="false">📍 ใกล้ฉัน</button>
        <button id="room-fav-only" class="rm-chip" type="button" aria-pressed="false">★ โปรด</button>
        <button id="room-ai-only" class="rm-chip" type="button" aria-pressed="false">💧 AI พบท่วม</button>
      </header>
      <div id="room-note" class="room-note"></div>
      <div id="room-grid" class="room-grid"></div>
      <div class="room-foot"><button id="room-more" class="btn" type="button" hidden>ดูเพิ่ม</button>
        <p class="muted tiny">ภาพนิ่งล่าสุดจากกล้องของหน่วยงานเจ้าของ รีเฟรชทุก 30 วินาทีเฉพาะช่องที่มองเห็น — <b>ดูเวลาที่พิมพ์บนภาพเสมอ</b> บางกล้องอัปเดตช้ากว่านั้น · “AI พบน้ำท่วม” เป็นการอ่านภาพอัตโนมัติ ยังไม่ผ่านการยืนยัน ใช้ประกอบเท่านั้น</p></div>
    </section>
    <dialog id="report-dialog" class="dialog"></dialog>
    <dialog id="cam-dialog" class="dialog cam-dialog"></dialog>
    <dialog id="yt-dialog" class="dialog cam-dialog"></dialog>
    <dialog id="windy-dialog" class="dialog cam-dialog"></dialog>
    <dialog id="mcam-dialog" class="dialog cam-dialog"></dialog>
    <dialog id="legend-dialog" class="dialog cam-dialog"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
