name: gistda-probe
# Manual, one-off: calls GISTDA's open disaster API with the repo secret GISTDA_API_KEY and prints only the shape of the answers.
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gistda-probe.mjs
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
