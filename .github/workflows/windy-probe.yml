name: windy-probe
# Manual, one-off: calls the Windy Webcams API with the repo secret WINDY_API_KEY and prints counts/shapes only.
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/windy-probe.mjs
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
