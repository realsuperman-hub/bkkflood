name: refresh-data
# Every ~15 min: refresh live data snapshots, deploy to Firebase Hosting, then send push alerts.
# Needs the repo secret FIREBASE_SERVICE_ACCOUNT (JSON key of service account bkkflood-deployer with roles
# Firebase Hosting Admin, Service Usage Consumer, Cloud Datastore User, Firebase Cloud Messaging Admin).
on:
  schedule:
    - cron: '7,22,37,52 * * * *' # every 15 min, offset from :00/:15 — GitHub drops/delays scheduled runs at the busy quarter-hour marks
  workflow_dispatch: {}
  push:
    branches: [main]

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the daily repeat-flood history update commits data-static/ back (GITHUB_TOKEN pushes do not start another run)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Write credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Fetch live data (if a source fails, keep the snapshot that is currently live)
        run: |
          mkdir -p public/data
          node scripts/fetch-stations.mjs || { echo "stations fetch failed — reusing live snapshot"; curl -sf https://bkkflood.web.app/data/stations.json -o public/data/stations.json || true; }
          node scripts/fetch-rain.mjs || { echo "rain fetch failed — reusing live snapshot"; curl -sf https://bkkflood.web.app/data/rain.json -o public/data/rain.json || true; }
          node scripts/fetch-floods.mjs || { echo "floods fetch failed — reusing live snapshot"; curl -sf https://bkkflood.web.app/data/floods.json -o public/data/floods.json || true; }
      - name: Fetch BMA traffic + drainage report (optional sources; missing pieces are copied from the live site)
        run: |
          node scripts/fetch-traffic.mjs || echo "BMA traffic fetch failed (cameras.json comes from data-static/)"
          # cameras + dds cannot be fetched from GitHub's servers (blocked); a Thai-network task keeps data-static/ current
          for f in cameras dds flood-history; do
            [ -s public/data/$f.json ] || cp "data-static/$f.json" "public/data/$f.json" 2>/dev/null || true
          done
          # flood headlines from Thai outlets' RSS (headline + link only); if every feed fails keep the live copy
          node scripts/fetch-news.mjs || curl -sf https://bkkflood.web.app/data/news.json -o public/data/news.json || true
          # RID dam API: try from GitHub first; if blocked, use the Thai-network copy, then whatever is live
          node scripts/fetch-dams.mjs || { [ -s data-static/dams.json ] && cp data-static/dams.json public/data/dams.json; } || curl -sf https://bkkflood.web.app/data/dams.json -o public/data/dams.json || true
          for f in traffic-events traffic-roads; do
            [ -s public/data/$f.json ] || curl -sf "https://bkkflood.web.app/data/$f.json" -o "public/data/$f.json" || true
          done
      - name: Extend the repeat-flood history (adds a day once it is over; otherwise a no-op)
        continue-on-error: true
        run: |
          node scripts/update-flood-history.mjs
          cp data-static/flood-history.json public/data/flood-history.json
          if ! git diff --quiet -- data-static; then
            git config user.name "bkkflood-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data-static/flood-history.json data-static/flood-history-state.json
            git commit -m "data: extend repeat-flood history"
            git pull --rebase origin main && git push origin HEAD:main || echo "history commit not pushed (it will be recomputed next run)"
          fi
      - name: Accuracy report (every 6 h; other runs reuse the live one)
        continue-on-error: true
        run: |
          mkdir -p public/data
          H=$(date -u +%H); M=$(date -u +%M)
          if { [ $((10#$H % 6)) -eq 0 ] && [ $((10#$M)) -lt 15 ]; } || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/evaluate-accuracy.mjs || curl -sf https://bkkflood.web.app/data/accuracy.json -o public/data/accuracy.json || true
          else
            curl -sf https://bkkflood.web.app/data/accuracy.json -o public/data/accuracy.json || true
          fi
      - run: npm run build
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project bkkflood-d54cc
      - name: Send push alerts
        # a notifier failure must never block the data refresh above
        continue-on-error: true
        run: node scripts/notify.mjs
      - name: Log forecast for accuracy tracking
        continue-on-error: true
        run: node scripts/log-eval.mjs
      - name: Remove credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
