name: refresh-data
# Every ~15 min: refresh live data snapshots, deploy to Firebase Hosting, then send push alerts.
# Needs the repo secret FIREBASE_SERVICE_ACCOUNT (JSON key of service account bkkflood-deployer with roles
# Firebase Hosting Admin, Service Usage Consumer, Cloud Datastore User, Firebase Cloud Messaging Admin).
on:
  schedule:
    - cron: '*/15 * * * *' # GitHub may delay scheduled runs by several minutes
  workflow_dispatch: {}
  push:
    branches: [main]

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Write credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Fetch live data (if a source fails, keep the snapshot that is currently live)
        run: |
          mkdir -p public/data
          node scripts/fetch-stations.mjs || { echo "stations fetch failed — reusing live snapshot"; curl -sf https://bkkflood.web.app/data/stations.json -o public/data/stations.json || true; }
          node scripts/fetch-rain.mjs || { echo "rain fetch failed — reusing live snapshot"; curl -sf https://bkkflood.web.app/data/rain.json -o public/data/rain.json || true; }
          node scripts/fetch-floods.mjs || { echo "floods fetch failed — reusing live snapshot"; curl -sf https://bkkflood.web.app/data/floods.json -o public/data/floods.json || true; }
      - run: npm run build
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project bkkflood-d54cc
      - name: Send push alerts
        # a notifier failure must never block the data refresh above
        continue-on-error: true
        run: node scripts/notify.mjs
      - name: Remove credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
